name: Sync Upstream
on:
  schedule:
    - cron: '0 0 * * *'  
  workflow_dispatch:     

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main 

      - name: Pull upstream changes
        uses: wei/pull@v1
        with:
          upstream_repository: multica-ai/multica  
          upstream_branch: main                    
          branch: main                             
