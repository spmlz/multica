name: Sync Upstream and Mirror to Gitee
on:
  schedule:
    - cron: '0 0 * * *' # 每天凌晨同步
  workflow_dispatch:     # 支持手动点击按钮同步

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. 把你的 Fork 仓库代码拉到本地
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_GITHUB_TOKEN }} # 使用内置 Token 获取权限
          fetch-depth: 0 # 必须拉取完整历史

      # 2. 配置 Git 用户信息
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # 3. 添加上游仓库并拉取更新 (Sync Upstream)
      - name: Fetch and Merge Upstream
        run: |
          git remote add upstream https://github.com/multica-ai/multica.git
          git fetch upstream
          git checkout main
          #  git merge upstream/main --no-edit
          git remote set-url origin https://x-access-token:${{ secrets.MY_GITHUB_TOKEN }}@github.com/spmlz/multica.git
          git push origin main

      # 4. 推送到 Gitee (Mirror to Gitee)
      - name: Sync to Gitee
        uses: wei/git-sync@v3
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_KEY }}
        with:
          source_repo: "spmlz/multica" # 你的 GitHub 仓库地址
          source_branch: "refs/heads/main"
          destination_repo: "git@gitee.com:temiao/multica.git" # 你的 Gitee 仓库 SSH 地址
          destination_branch: "refs/heads/main"
